name: CI # master로 머지되기 전에 테스트로 검증하는 워크플로

on:
  pull_request:
    branches: [ "master" ]  # master를 대상으로 하는 PR에서 실행

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # @SpringBootTest가 뜨려면 DB와 Redis가 떠 있어야 한다.
    # runner의 localhost로 포트가 열려 application-test.yaml 설정과 그대로 맞는다.
    services:
      mysql:
        image: mysql:8.0  # 잠금/격리 수준 동작이 버전에 따라 달라 로컬과 같은 버전으로 고정
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cgv_test
        ports:
          - 3306:3306
        # 컨테이너가 떠도 MySQL이 접속을 받기까지는 시간이 걸리므로 준비될 때까지 기다린다
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # .env는 저장소에 없으므로(gitignore) 플레이스홀더를 채울 값을 직접 넣는다.
    # 전부 테스트 전용 더미이며 운영 값과 무관하다.
    env:
      DB_URL: jdbc:mysql://localhost:3306/cgv_test
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: ci-dummy-jwt-secret-key-not-for-production-use
      # 토스가 공식 문서에 공개한 테스트 키
      TOSS_CLIENT_KEY: test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm
      TOSS_SECRET_KEY: test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 유닛 테스트와 @SpringBootTest를 모두 실행한다.
      # PaymentConcurrencyTest는 테스트컨테이너로 자체 MySQL을 띄우며,
      # runner에 Docker가 있으므로 추가 설정 없이 동작한다.
      - name: Run tests
        run: ./gradlew test

      # 실패한 경우에만 리포트를 올려 로그만으로 원인을 못 찾는 상황을 줄인다
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7