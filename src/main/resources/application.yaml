spring:
  application:
    name: spring-cgv

  config:
    import: optional:file:.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: ${JWT_SECRET}
  at-validity: 1800000 # 30분
  rt-validity: 1209600000 # 14일

logging:
  level:
    org.hibernate.sql: debug

payment:
  toss:
    test_client_api_key: ${TOSS_CLIENT_KEY}
    test_secret_api_key: ${TOSS_SECRET_KEY}
    success_url: "http://localhost:8080/api/v1/payments/toss/success"
    failure_url: "http://localhost:8080/api/v1/payments/toss/fail"